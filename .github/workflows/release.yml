name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the tag matches the package version
        run: python3 packaging/check_version.py "$GITHUB_REF_NAME"
      - name: Build the sdist and wheel
        run: |
          python3 -m pip install --quiet build
          python3 -m build
      - name: Render the Homebrew formula
        run: python3 packaging/render_homebrew_formula.py dist/*.tar.gz packaging/homebrew/poppy-ai.rb
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew
          path: packaging/homebrew/poppy-ai.rb

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: homebrew
          path: homebrew/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* homebrew/*.rb --generate-notes --title "$GITHUB_REF_NAME"
