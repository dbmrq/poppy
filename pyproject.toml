[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poppy-agent"
description = "Turn coding-agent session history into reviewed skills, memories, and rules."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "dbmrq" }]
dynamic = ["version"]
dependencies = []

[project.urls]
Homepage = "https://github.com/dbmrq/poppy"

[project.scripts]
poppy = "poppy.cli:main"

[tool.setuptools.dynamic]
version = { attr = "poppy.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
poppy = ["data/**/*"]
